<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku CSP</title>

<style>
:root {
  --bg: #020617;
  --card: #0f172a;
  --cell: #1e293b;
  --accent: #38bdf8;
  --fixed: #334155;
  --text: #e5e7eb;
}

* { box-sizing: border-box; font-family: system-ui, sans-serif; }

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(160deg, #020617, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--text);
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 16px;
}

.card {
  background: var(--card);
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,.7);
}

h1 {
  text-align: center;
  color: var(--accent);
  margin: 0 0 8px;
}

.stats {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 12px;
  opacity: .85;
}

#board {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  border: 3px solid var(--accent);
  border-radius: 10px;
  overflow: hidden;
}

.cell {
  aspect-ratio: 1;
  background: var(--cell);
  border: 1px solid #475569;
  text-align: center;
  font-size: clamp(18px, 5vw, 24px);
  color: white;
}

/* 3x3 grid lines */
.cell:nth-child(3n) { border-right: 3px solid var(--accent); }
.cell:nth-child(9n) { border-right: 1px solid #475569; }
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 3px solid var(--accent);
}

.prefilled {
  background: var(--fixed);
  font-weight: bold;
}

.cell:focus {
  outline: 2px solid var(--accent);
}

.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 14px;
}

button {
  padding: 12px 0;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

#message {
  text-align: center;
  margin-top: 10px;
  font-weight: 600;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>Sudoku</h1>

    <div class="stats">
      <span id="timer">Time: 0s</span>
      <span id="best">Best: --</span>
    </div>

    <div id="board"></div>

    <div class="actions">
      <button onclick="checkSolution()">Check</button>
      <button onclick="solveSudoku()">Solve</button>
      <button onclick="newGame()">New</button>
    </div>

    <div id="message"></div>
  </div>
</div>

<script>
const puzzle = [
 [5,3,0,0,7,0,0,0,0],
 [6,0,0,1,9,5,0,0,0],
 [0,9,8,0,0,0,0,6,0],
 [8,0,0,0,6,0,0,0,3],
 [4,0,0,8,0,3,0,0,1],
 [7,0,0,0,2,0,0,0,6],
 [0,6,0,0,0,0,2,8,0],
 [0,0,0,4,1,9,0,0,5],
 [0,0,0,0,8,0,0,7,9]
];

const board = document.getElementById("board");
const message = document.getElementById("message");

let time = 0;
let timer = setInterval(updateTimer, 1000);

function updateTimer() {
  time++;
  document.getElementById("timer").innerText = `Time: ${time}s`;
}

function loadBestTime() {
  const best = localStorage.getItem("bestTime");
  if (best) document.getElementById("best").innerText = `Best: ${best}s`;
}

function saveBestTime() {
  const best = localStorage.getItem("bestTime");
  if (!best || time < best) {
    localStorage.setItem("bestTime", time);
    loadBestTime();
  }
}

function createBoard() {
  board.innerHTML = "";
  puzzle.flat().forEach(num => {
    const input = document.createElement("input");
    input.className = "cell";
    input.maxLength = 1;

    if (num !== 0) {
      input.value = num;
      input.disabled = true;
      input.classList.add("prefilled");
    } else {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/[^1-9]/g, "");
      });
    }
    board.appendChild(input);
  });
}

function getGrid() {
  let grid = [...Array(9)].map(() => Array(9).fill(0));
  document.querySelectorAll(".cell").forEach((c, i) => {
    grid[Math.floor(i / 9)][i % 9] = Number(c.value) || 0;
  });
  return grid;
}

function isValid(arr) {
  const nums = arr.filter(n => n !== 0);
  return nums.length === new Set(nums).size;
}

function checkSolution() {
  const grid = getGrid();

  for (let i = 0; i < 9; i++) {
    if (!isValid(grid[i]) || !isValid(grid.map(r => r[i]))) {
      message.innerText = "❌ Constraint violation";
      message.style.color = "red";
      return;
    }
  }

  for (let r = 0; r < 9; r += 3)
    for (let c = 0; c < 9; c += 3) {
      let box = [];
      for (let i = 0; i < 3; i++)
        for (let j = 0; j < 3; j++)
          box.push(grid[r+i][c+j]);
      if (!isValid(box)) {
        message.innerText = "❌ Constraint violation";
        message.style.color = "red";
        return;
      }
    }

  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++)
      if (grid[r][c] === 0) {
        message.innerText = "👍 You are on track!";
        message.style.color = "#38bdf8";
        return;
      }

  message.innerText = "🎉 Solved!";
  message.style.color = "#22c55e";
  saveBestTime();
}

function solveSudoku() {
  let grid = puzzle.map(r => r.slice());
  solveCSP(grid);
  document.querySelectorAll(".cell").forEach((c, i) => {
    c.value = grid[Math.floor(i / 9)][i % 9];
    c.disabled = true;
  });
  message.innerText = "Solved using CSP";
  message.style.color = "#22c55e";
}

function isSafe(grid, r, c, n) {
  for (let x = 0; x < 9; x++)
    if (grid[r][x] === n || grid[x][c] === n) return false;

  let sr = r - r % 3, sc = c - c % 3;
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++)
      if (grid[sr+i][sc+j] === n) return false;

  return true;
}

function solveCSP(grid) {
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++)
      if (grid[r][c] === 0) {
        for (let n = 1; n <= 9; n++) {
          if (isSafe(grid, r, c, n)) {
            grid[r][c] = n;
            if (solveCSP(grid)) return true;
            grid[r][c] = 0;
          }
        }
        return false;
      }
  return true;
}

function newGame() {
  time = 0;
  message.innerText = "";
  createBoard();
}

createBoard();
loadBestTime();
</script>
</body>
</html>
