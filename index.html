<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku – CSP</title>

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --cell:#1e293b;
  --fixed:#334155;
  --accent:#38bdf8;
  --text:#e5e7eb;
  --wrong:#7f1d1d;
}

*{box-sizing:border-box;font-family:system-ui,sans-serif;}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(160deg,#020617,#000);
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text);
}

.container{max-width:420px;width:100%;padding:16px;}
.card{
  background:var(--card);
  padding:16px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.7);
}

h1{text-align:center;color:var(--accent);margin:0 0 8px;}

.stats{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:12px;
}

#board{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  border:3px solid var(--accent);
  border-radius:10px;
  overflow:hidden;
}

.cell{
  aspect-ratio:1;
  width:100%;
  border:1px solid #475569;
  background:var(--cell);
  color:white;
  text-align:center;
  font-size:clamp(18px,5vw,24px);
}

.prefilled{background:var(--fixed);font-weight:bold;}
.wrong{background:var(--wrong)!important;}

.cell:focus{outline:2px solid var(--accent);}

.cell:nth-child(3n){border-right:3px solid var(--accent);}
.cell:nth-child(9n){border-right:1px solid #475569;}
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54){
  border-bottom:3px solid var(--accent);
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  font-weight:700;
  cursor:pointer;
}

#message{text-align:center;margin-top:10px;font-weight:600;}
</style>
</head>

<body>
<div class="container">
<div class="card">
<h1>Sudoku</h1>

<div class="stats">
  <span id="timer">Time: 0s</span>
  <span id="best">Best: --</span>
</div>

<div id="board"></div>

<div class="actions">
  <button onclick="check()">Check</button>
  <button onclick="solve()">Solve</button>
  <button onclick="resetGame()">New</button>
</div>

<div id="message"></div>
</div>
</div>

<script>
const puzzle=[
 [5,3,0,0,7,0,0,0,0],
 [6,0,0,1,9,5,0,0,0],
 [0,9,8,0,0,0,0,6,0],
 [8,0,0,0,6,0,0,0,3],
 [4,0,0,8,0,3,0,0,1],
 [7,0,0,0,2,0,0,0,6],
 [0,6,0,0,0,0,2,8,0],
 [0,0,0,4,1,9,0,0,5],
 [0,0,0,0,8,0,0,7,9]
];

let solution;
let time=0;
setInterval(()=>document.getElementById("timer").innerText=`Time: ${++time}s`,1000);

function solveCSP(g){
  for(let r=0;r<9;r++)
    for(let c=0;c<9;c++)
      if(g[r][c]===0){
        for(let n=1;n<=9;n++){
          if(isSafe(g,r,c,n)){
            g[r][c]=n;
            if(solveCSP(g)) return true;
            g[r][c]=0;
          }
        }
        return false;
      }
  return true;
}

function isSafe(g,r,c,n){
  for(let i=0;i<9;i++)
    if(g[r][i]===n||g[i][c]===n) return false;
  let sr=r-r%3,sc=c-c%3;
  for(let i=0;i<3;i++)
    for(let j=0;j<3;j++)
      if(g[sr+i][sc+j]===n) return false;
  return true;
}

function buildBoard(){
  const b=document.getElementById("board");
  b.innerHTML="";
  puzzle.flat().forEach(n=>{
    const c=document.createElement("input");
    c.className="cell";
    c.maxLength=1;
    if(n){
      c.value=n;
      c.disabled=true;
      c.classList.add("prefilled");
    }else{
      c.oninput=()=>c.value=c.value.replace(/[^1-9]/g,"");
    }
    b.appendChild(c);
  });
}

function getGrid(){
  let g=[...Array(9)].map(()=>Array(9).fill(0));
  document.querySelectorAll(".cell").forEach((c,i)=>{
    g[Math.floor(i/9)][i%9]=Number(c.value)||0;
  });
  return g;
}

function clearMarks(){
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("wrong"));
}

function check(){
  clearMarks();
  const user=getGrid();
  let filled=true, wrong=false;

  document.querySelectorAll(".cell").forEach((c,i)=>{
    let r=Math.floor(i/9),col=i%9;
    if(user[r][col]!==0){
      if(user[r][col]!==solution[r][col]){
        c.classList.add("wrong");
        wrong=true;
      }
    }else filled=false;
  });

  if(wrong){
    msg("❌ Wrong placement","red");
  }else if(!filled){
    msg("👍 You are on track!","#38bdf8");
  }else{
    msg("🎉 Solved!","#22c55e");
    saveBest();
  }
}

function solve(){
  clearMarks();
  const user=getGrid();
  for(let r=0;r<9;r++)
    for(let c=0;c<9;c++)
      if(user[r][c]!==0 && user[r][c]!==solution[r][c]){
        msg("❌ Fix wrong entries first","red");
        return;
      }

  document.querySelectorAll(".cell").forEach((c,i)=>{
    if(!c.value){
      c.value=solution[Math.floor(i/9)][i%9];
      c.disabled=true;
    }
  });
  msg("Solved using CSP","#22c55e");
}

function saveBest(){
  const b=localStorage.getItem("bestTime");
  if(!b||time<Number(b)){
    localStorage.setItem("bestTime",time);
  }
  loadBest();
}

function loadBest(){
  const b=localStorage.getItem("bestTime");
  document.getElementById("best").innerText=b?`Best: ${b}s`:"Best: --";
}

function msg(t,c){
  const m=document.getElementById("message");
  m.innerText=t;
  m.style.color=c;
}

function resetGame(){
  time=0;
  msg("","");
  buildBoard();
}

solution=puzzle.map(r=>r.slice());
solveCSP(solution);
buildBoard();
loadBest();
</script>
</body>
</html>
